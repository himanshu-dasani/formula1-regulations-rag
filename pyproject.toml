[project]
name = "formula1-regulations-rag"
version = "0.1.0"
description = "A notebook RAG prototype for question answering over Formula 1 regulation PDFs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "langchain-chroma>=1.1.0",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters",
    "pymupdf",
    "python-dotenv",
]

[project.optional-dependencies]
faiss = [
    "faiss-cpu>=1.11.0",
]
huggingface = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
